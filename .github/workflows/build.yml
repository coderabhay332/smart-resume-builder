name: Build on pr

on:
    pull_request:
        branches:
            - edit-feature
            - main
jobs:
    build: 
        name: Build
        runs-on: ubuntu-latest  
        steps:
            - name: Checkout
              uses: actions/checkout@v3

            - name: install dependencies
              run: npm install

            - name: Run build
              run: npx tsc
