name: Build & Push Docker Image

on:
  push:
    branches:
      - edit-feture
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}  # Ensure this is 'coderabhay1'
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            coderabhay1/resume-builder-backend:latest
            coderabhay1/resume-builder-backend:${{ github.sha }}

      - name: Verify pushed image
        run: |
          docker pull coderabhay1/resume-builder-backend:latest
          docker images